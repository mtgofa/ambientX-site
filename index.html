<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmbientX</title>
<meta name="description" content="AmbientX: control Bluetooth LED strips from your phone and Android Auto.">
<style>
  :root { --bg: #0e0f14; --fg: #f2f3f7; --muted: #9097a8; --accent: #8c7cff; --line: #2a2d3a; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --fg: #1b1d24; --muted: #5d6475; --accent: #6a58f0; --line: #e4e6ec; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  .logo { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%;
    background: conic-gradient(#ff3d6e, #ffb300, #3dff8b, #29b6ff, #8c5cff, #ff3d6e);
    -webkit-mask: radial-gradient(circle, transparent 34%, #000 35%); mask: radial-gradient(circle, transparent 34%, #000 35%); }
  h1 { margin: 0 0 8px; font-size: 2rem; }
  p { color: var(--muted); }
  a.btn { display: inline-block; margin-top: 20px; padding: 10px 20px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg); text-decoration: none; }
  a.btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"></div>
  <h1>AmbientX</h1>
  <p>Control Bluetooth LED strips (ELK-BLEDOM, MELK and compatible controllers) from your phone and Android Auto.</p>
  <p lang="ar" dir="rtl">تحكم في شرائط LED بالبلوتوث من الموبايل ومن Android Auto.</p>
  <a class="btn" href="privacy.html">Privacy policy · سياسة الخصوصية</a>
</main>
</body>
</html>
